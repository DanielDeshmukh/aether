name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  nextjs:
    name: Next.js Build
    runs-on: ubuntu-latest
    env:
      AETHER_JWT_SECRET: ci-test-secret-do-not-use-in-production
      DATABASE_URL: postgresql://unused:unused@localhost:5432/unused
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: aether/package-lock.json

      - name: Install dependencies
        working-directory: aether
        run: npm ci

      - name: Generate Prisma Client
        working-directory: aether
        run: npx prisma generate

      - name: Build
        working-directory: aether
        run: npx next build
